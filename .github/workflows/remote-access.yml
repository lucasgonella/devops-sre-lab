name: Acesso temporario ao homelab

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: homelab-remote-access
  cancel-in-progress: false

jobs:
  remote-access:
    if: >-
      github.repository == 'lucasgonella/devops-sre-lab' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'lucasgonella'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 65
    steps:
      - name: Abrir acesso SSH temporario por 60 minutos
        shell: bash
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          EXPECTED_RUNNER: ${{ runner.name }}
          RESCUE_PUBLIC_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID5NXx7LYWWkgzKmQoPcjPqD07KgEV9JUnL1NUH/pTG1
        run: |
          set -Eeuo pipefail
          set +x
          umask 077

          [[ "$EXPECTED_RUNNER" == runner01 ]] || { echo 'Runner inesperado.' >&2; exit 1; }
          [[ "$(id -un)" == runner ]] || { echo 'Usuario inesperado: requer runner.' >&2; exit 1; }
          [[ -n "$TS_AUTHKEY" ]] || { echo 'Secret TAILSCALE_AUTHKEY ausente.' >&2; exit 1; }
          [[ "$(uname -m)" == x86_64 ]] || exit 1
          for tool in curl tar sha256sum ssh-keyscan ssh-keygen timeout getent awk date; do
            command -v "$tool" >/dev/null || { echo "Ferramenta ausente: $tool" >&2; exit 1; }
          done

          ts_dir=$(mktemp -d /tmp/homelab-ts.XXXXXX)
          ts_pid=''
          rescue_line=''
          auth_file=''
          cleanup() {
            set +e
            # Remover apenas a linha desta execucao, preservando as outras chaves.
            if [[ -n "$rescue_line" && -f "$auth_file" && ! -L "$auth_file" ]]; then
              auth_tmp=$(mktemp "${auth_file}.cleanup.XXXXXX")
              if [[ -n "$auth_tmp" ]] && awk -v key="$rescue_line" '$0 != key' "$auth_file" > "$auth_tmp"; then
                chmod 600 "$auth_tmp"
                mv -f -- "$auth_tmp" "$auth_file"
              else
                echo 'Falha ao remover chave temporaria; ela possui expiracao automatica.' >&2
                [[ -n "$auth_tmp" ]] && rm -f -- "$auth_tmp"
              fi
            fi
            if [[ -n "$ts_pid" ]]; then
              timeout 10 "$ts_dir/tailscale" --socket="$ts_dir/tailscaled.sock" logout >/dev/null 2>&1
              kill "$ts_pid" 2>/dev/null
              wait "$ts_pid" 2>/dev/null
            fi
            rm -rf -- "$ts_dir"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s' "$TS_AUTHKEY" > "$ts_dir/authkey"
          unset TS_AUTHKEY

          # A chave abre somente su - gonella, que ainda exige a senha de gonella.
          [[ -x /usr/bin/su ]] || { echo 'su indisponivel.' >&2; exit 1; }
          getent passwd gonella >/dev/null || { echo 'Conta gonella ausente.' >&2; exit 1; }
          runner_home=$(getent passwd runner | awk -F: '{print $6}')
          runner_shell=$(getent passwd runner | awk -F: '{print $7}')
          case "$runner_shell" in
            */nologin|*/false|'') echo 'Conta runner sem shell de login.' >&2; exit 1 ;;
          esac
          [[ "$runner_home" == /home/runner ]] || { echo 'Home inesperado.' >&2; exit 1; }
          ssh_dir="$runner_home/.ssh"
          auth_file="$ssh_dir/authorized_keys"
          [[ ! -L "$ssh_dir" && ! -L "$auth_file" ]] || { echo 'Caminho SSH simbolico: revisao necessaria.' >&2; exit 1; }
          mkdir -p "$ssh_dir"
          [[ -O "$ssh_dir" && -w "$ssh_dir" ]] || exit 1
          if [[ -e "$auth_file" ]]; then
            [[ -f "$auth_file" && -O "$auth_file" && -w "$auth_file" ]] || exit 1
          fi
          printf '%s\n' "$RESCUE_PUBLIC_KEY" > "$ts_dir/rescue.pub"
          ssh-keygen -lf "$ts_dir/rescue.pub"

          # Confirmar SSH local antes de consumir a chave de uso unico.
          ssh-keyscan -T 5 -t ed25519 127.0.0.1 > "$ts_dir/ssh-host.pub" 2>/dev/null
          [[ -s "$ts_dir/ssh-host.pub" ]] || { echo 'SSH local indisponivel.' >&2; exit 1; }
          echo 'Fingerprint SSH do runner01: confira ao conectar.'
          ssh-keygen -lf "$ts_dir/ssh-host.pub"

          # Binarios oficiais, sem sudo, sem checkout e sem instalacao no sistema.
          ts_version=1.102.3
          ts_url="https://pkgs.tailscale.com/stable/tailscale_${ts_version}_amd64.tgz"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 120 "$ts_url" -o "$ts_dir/tailscale.tgz"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 30 "$ts_url.sha256" -o "$ts_dir/checksum"
          read -r ts_sha _ < "$ts_dir/checksum" || true
          [[ "$ts_sha" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'Checksum invalido.' >&2; exit 1; }
          printf '%s  %s\n' "$ts_sha" "$ts_dir/tailscale.tgz" | sha256sum -c -
          tar -xzf "$ts_dir/tailscale.tgz" -C "$ts_dir" --strip-components=1 \
            "tailscale_${ts_version}_amd64/tailscale" \
            "tailscale_${ts_version}_amd64/tailscaled"

          "$ts_dir/tailscaled" \
            --tun=userspace-networking \
            --state=mem: \
            --socket="$ts_dir/tailscaled.sock" \
            --port=0 > "$ts_dir/daemon.log" 2>&1 &
          ts_pid=$!
          for attempt in {1..30}; do
            kill -0 "$ts_pid" 2>/dev/null || { echo 'Tailscaled encerrou antes da conexao.' >&2; exit 1; }
            [[ -S "$ts_dir/tailscaled.sock" ]] && break
            sleep 1
          done
          [[ -S "$ts_dir/tailscaled.sock" ]] || { echo 'Socket Tailscale indisponivel.' >&2; exit 1; }

          if ! "$ts_dir/tailscale" --socket="$ts_dir/tailscaled.sock" up \
            --auth-key="file:$ts_dir/authkey" \
            --hostname=runner01-resgate \
            --accept-dns=false \
            --accept-routes=false \
            --timeout=90s > "$ts_dir/auth.log" 2>&1; then
            echo 'Falha ao autenticar. Confira a validade do secret e eventual aprovacao em Machines.' >&2
            echo 'Chave de uso unico consumida exige gerar outra antes de repetir.' >&2
            exit 1
          fi
          rm -f -- "$ts_dir/authkey"
          ts_ip=$("$ts_dir/tailscale" --socket="$ts_dir/tailscaled.sock" ip -4)
          [[ "$ts_ip" =~ ^100\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'IP Tailscale inesperado.' >&2; exit 1; }
          # Userspace encaminha a conexao SSH para localhost. PTY permite a senha
          # de su; forwarding fica bloqueado. A chave expira mesmo apos falha de cleanup.
          rescue_expiry=$(date -u -d '+65 minutes' +%Y%m%d%H%M%SZ)
          rescue_line="restrict,pty,from=\"127.0.0.1,::1\",expiry-time=\"$rescue_expiry\",command=\"/usr/bin/su - gonella\" $RESCUE_PUBLIC_KEY homelab-resgate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          chmod 700 "$ssh_dir"
          touch "$auth_file"
          chmod 600 "$auth_file"
          printf '\n%s\n' "$rescue_line" >> "$auth_file"
          echo "ACESSO PRONTO: ssh -t -i ~/.ssh/homelab_resgate -o IdentitiesOnly=yes runner@$ts_ip"
          echo 'Confira o fingerprint do servidor. A passphrase protege a chave local.'
          echo 'Depois, Password solicita a senha de gonella no servidor (su - gonella).'
          echo 'Janela de 60 minutos. Cancelar este workflow encerra o acesso temporario.'

          # O processo permanece ligado ao job; nao sobrevive ao seu encerramento.
          ts_deadline=$((SECONDS + 3600))
          while (( SECONDS < ts_deadline )); do
            kill -0 "$ts_pid" 2>/dev/null || { echo 'Conexao temporaria encerrada.' >&2; exit 1; }
            sleep 15
          done
