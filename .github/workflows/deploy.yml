name: Deploy

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Deploy na app01
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SHA inválido: $DEPLOY_SHA" >&2
            exit 1
          fi

          ssh \
            -i /home/runner/.ssh/id_ed25519_app01 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=/home/runner/.ssh/known_hosts \
            deploy@192.168.1.110 \
            "sudo -n /usr/local/sbin/deploy-app '$DEPLOY_SHA'"

      - name: Validar aplicação pela runner01
        run: |
          curl -fsS http://192.168.1.110:8000/health
          echo
          curl -fsS http://192.168.1.110:8000/ready
          echo
