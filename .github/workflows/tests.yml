name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest

      - name: Construir imagem Docker
        run: docker build -t devops-sre-lab:test .

      - name: Iniciar container
        run: docker run -d --name devops-sre-api -p 8000:8000 devops-sre-lab:test
      
      - name: Validar health do container
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs devops-sre-api
          exit 1
      
      - name: Remover container
        if: always()
        run: docker rm -f devops-sre-api

      - name: Login no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}

          docker tag devops-sre-lab:test $IMAGE:${{ github.sha }}
          docker tag devops-sre-lab:test $IMAGE:latest

          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
